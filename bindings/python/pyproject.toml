[build-system]
requires = ["setuptools>=64", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-engine"
dynamic = ["version"]
requires-python = ">= 2.7, != 3.0.*, != 3.1.*, != 3.2.*, != 3.3.*, != 3.4.*, != 3.5.*, != 3.6.*"
dependencies = [
    "importlib_resources; python_version < '3.9'"
]
authors = [
    { name = "Nguyen Anh Quynh", email = "quynh@gmail.com" },
]
description = "Keystone assembler engine"
readme = "README.md"
keywords = ["assembler"]
license = { text = "BSD License" }
classifiers = [
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python :: 2.7',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Build Tools',
]

[project.urls]
Homepage = "https://www.keystone-engine.org/"
Repository = "https://github.com/keystone-engine/keystone"
"Bug Tracker" = "https://github.com/keystone-engine/keystone/issues"
Changelog = "https://github.com/keystone-engine/keystone/blob/master/ChangeLog"

[tool.setuptools.packages.find]
include = ["keystone*"]

[tool.setuptools_scm]
root = '../../'
